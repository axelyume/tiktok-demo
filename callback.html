<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Logowanie TikTok</title>
</head>
<body>
  <h1>Logowanie TikTok</h1>
  <p id="status">Trwa logowanie…</p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get("code");
    const state = params.get("state");
    if (code) {
      document.getElementById("status").innerText = "Zalogowano! Kod autoryzacji otrzymany.";
    } else {
      document.getElementById("status").innerText = "Brak kodu autoryzacji. Spróbuj ponownie.";
    }
  </script>
</body>
</html>
